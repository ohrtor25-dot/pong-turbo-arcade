<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong Turbo Arcade</title><style>body{background:#080c1c;color:white;font:16px system-ui;text-align:center;margin:0;padding:12px}button,input,select{padding:12px;margin:4px;background:#1d2942;color:white;border:1px solid #667;border-radius:8px;font:inherit}canvas{width:100%;max-width:800px;background:#090e20;touch-action:none;border:2px solid #456}#status{min-height:32px;color:#facc15}.row{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}#fire{background:#a53a14}h1{color:#facc15;font-family:monospace}</style></head><body><h1>⚡ PONG TURBO ARCADE</h1><div class="row"><input id="name" placeholder="Dein Name" value="Player"><select id="mode"><option value="classic">Klassisch</option><option value="arena">Arena – 4 Seiten</option></select><select id="level"><option value="1">CPU Leicht</option><option value="2" selected>CPU Mittel</option><option value="3">CPU Schwer</option></select></div><div class="row"><button id="create">Lobby erstellen</button><input id="code" placeholder="Lobby-Code"><button id="join">Beitreten</button><button id="start">Starten</button><button id="music">♫ Musik AN</button></div><div id="status">Online-Lobby erstellen oder beitreten</div><div id="score">0 : 0</div><canvas id="field" width="800" height="480"></canvas><div class="row"><button id="up">▲ HOCH</button><button id="fire">🔥 TURBO / FIRE</button><button id="down">▼ RUNTER</button></div><p>1 bis 4 Handys · eigener Lobbycode · fehlende Spieler werden durch Computer ersetzt · im Feld ziehen oder Pfeiltasten verwenden</p><script type="module" src="/src.js"></script></body></html>
